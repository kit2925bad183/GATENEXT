server:
  port: 8080
  servlet:
    session:
      cookie:
        name: GATENEST_SESSION
        http-only: true
        same-site: lax
        secure: false
      timeout: 8h

spring:
  application:
    name: gatenest-backend
  datasource:
    url: jdbc:h2:file:./data/gatenest_dev;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;NON_KEYWORDS=USER,VALUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
    hikari:
      pool-name: GateNestDevPool
      maximum-pool-size: 10
      minimum-idle: 2
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  session:
    store-type: jdbc
    jdbc:
      initialize-schema: never
      table-name: SPRING_SESSION

gatenest:
  security:
    cors:
      allowed-origins:
        - "http://localhost:5173"
        - "http://localhost:3000"
        - "http://127.0.0.1:5173"
  bootstrap:
    admin-token: bootstrap-gatenest-admin-secret-2026
  default-timezone: Asia/Kolkata

logging:
  level:
    root: INFO
    com.gatenest: DEBUG
    org.springframework.security: INFO
    org.springframework.jdbc: INFO
