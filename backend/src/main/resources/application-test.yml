spring:
  datasource:
    url: jdbc:h2:mem:gatenest_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password: ''
    driver-class-name: org.h2.Driver
  flyway:
    enabled: false
  session:
    store-type: none

gatenest:
  security:
    cors:
      allowed-origins:
        - "http://localhost:5173"
  bootstrap:
    admin-token: test-admin-bootstrap-secret
  default-timezone: Asia/Kolkata
