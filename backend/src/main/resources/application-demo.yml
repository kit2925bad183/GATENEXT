server:
  port: 8080
  servlet:
    session:
      cookie:
        name: GATENEST_DEMO_SESSION
        http-only: true
        same-site: lax
        secure: false
      timeout: 8h

spring:
  application:
    name: gatenest-backend-demo
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/gatenest_demo?useSSL=false&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:demo_user}
    password: ${SPRING_DATASOURCE_PASSWORD:demo_pass}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:com.mysql.cj.jdbc.Driver}
    hikari:
      pool-name: GateNestDemoPool
      maximum-pool-size: 15
      minimum-idle: 3
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  session:
    store-type: jdbc
    jdbc:
      initialize-schema: never
      table-name: SPRING_SESSION

gatenest:
  demo-mode: true
  community-name: "Bluehaven Residency — Demo"
  outbound-notifications-enabled: false
  security:
    cors:
      allowed-origins:
        - "http://localhost:5173"
        - "http://localhost:3000"
        - "http://127.0.0.1:5173"
        - "http://localhost"
        - "http://127.0.0.1"
  bootstrap:
    admin-token: demo-gatenest-admin-presentation-2026
  default-timezone: Asia/Kolkata

logging:
  level:
    root: INFO
    com.gatenest: INFO
    com.gatenest.service.DemoDataSeederService: INFO
    org.springframework.security: WARN
