services:
  # MySQL 8.4 LTS Database
  db:
    image: mysql:8.4.0
    container_name: gatenest-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-gatenest_db}
      MYSQL_USER: ${DB_USER:-gatenest_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-gatenest_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_gatenest_secure_2026}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-time-zone=+00:00
      --max-connections=200
    networks:
      - gatenest_internal
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${DB_USER:-gatenest_user}", "-p${DB_PASSWORD:-gatenest_password}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Spring Boot 3 Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gatenest-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/${DB_NAME:-gatenest_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-gatenest_user}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-gatenest_password}
      GATENEST_SECURITY_CORS_ALLOWED_ORIGINS: ${APP_PUBLIC_URL:-http://localhost}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - gatenest_internal
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    ports:
      - "8080:8080"

  # Nginx Reverse Proxy & Frontend PWA
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gatenest-frontend
    restart: unless-stopped
    ports:
      - "${PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - gatenest_internal

networks:
  gatenest_internal:
    driver: bridge

volumes:
  mysql_data:
    name: gatenest_mysql_data

