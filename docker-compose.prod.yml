services:
  # 1. Private MySQL 8.4 Database Container
  db:
    image: mysql:8.4.0
    container_name: gatenest-prod-db
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_NAME:-gatenest_db}
      MYSQL_USER: ${DB_USER:-gatenest_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-gatenest_secure_pass_2026}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_gatenest_vault_2026}
    volumes:
      - prod_db_data:/var/lib/mysql
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-time-zone=+00:00
      --max-connections=200
    networks:
      - gatenest_internal
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${DB_USER:-gatenest_user}", "-p${DB_PASSWORD:-gatenest_secure_pass_2026}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Spring Boot 3 Backend Container
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gatenest-prod-backend
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/${DB_NAME:-gatenest_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-gatenest_user}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-gatenest_secure_pass_2026}
      GATENEST_SECURITY_CORS_ALLOWED_ORIGINS: ${APP_PUBLIC_URL:-http://localhost}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - gatenest_internal
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # 3. Nginx Reverse Proxy & Frontend PWA Container
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gatenest-prod-frontend
    restart: always
    ports:
      - "${PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - gatenest_internal

networks:
  gatenest_internal:
    driver: bridge

volumes:
  prod_db_data:
    name: gatenest_prod_db_data
