# version: '3.8'

services:
  # MySQL Database
  db:
    image: mysql:8.4.0
    container_name: gatenest-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: gatenest_demo
      MYSQL_USER: demo_user
      MYSQL_PASSWORD: demo_pass
      MYSQL_ROOT_PASSWORD: root_demo_secure_2026
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-time-zone=+00:00
      --max-connections=200
    networks:
      - gatenest_internal
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "demo_user", "-pdemo_pass"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Spring Boot Backend (Demo profile)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gatenest-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: demo
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/gatenest_demo?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: demo_user
      SPRING_DATASOURCE_PASSWORD: demo_pass
      GATENEST_SECURITY_CORS_ALLOWED_ORIGINS: http://localhost
    depends_on:
      db:
        condition: service_healthy
    networks:
      - gatenest_internal
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    ports:
      - "8080:8080"

  # Frontend (React SPA) served via Nginx
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gatenest-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - gatenest_internal

networks:
  gatenest_internal:
    driver: bridge

volumes:
  mysql_data:
    name: gatenest_mysql_data
